[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 için Node 20.19+ yeterli; React Router 8 ise Node 22.22+ istiyor.
  NODE_VERSION = "22"

# Var olmayan dosya adresleri HTML yerine gerçek 404 döner. Aksi halde aşağıdaki SPA kuralı bunlara
# 200 ile index.html verir; tarayıcılar, arama motorları ve ajanlar (örn. Lighthouse) HTML'i dosya sanar.
# Bu kurallar `force` olmadan yazıldığı için yalnızca diskte o dosya yoksa uygulanır: ileride
# llms.txt, sitemap.xml gibi bir dosya eklenirse dosyanın kendisi sunulur. Gövde: /404.txt (düz metin).
# Sıra önemli: ilk eşleşen kural uygulanır; bu yüzden SPA kuralından önce gelirler.
[[redirects]]
  from = "/.well-known/*"
  to = "/404.txt"
  status = 404

[[redirects]]
  from = "/ai-catalog.json"
  to = "/404.txt"
  status = 404

# Yayın adresi belli olunca llms.txt eklenecek; o zamana kadar 404.
[[redirects]]
  from = "/llms.txt"
  to = "/404.txt"
  status = 404

[[redirects]]
  from = "/llms-full.txt"
  to = "/404.txt"
  status = 404

# Site haritası yayın adresi belli olunca eklenecek; o zamana kadar 404.
[[redirects]]
  from = "/sitemap.xml"
  to = "/404.txt"
  status = 404

# Sitenin simgesi /favicon.svg'dir; tarayıcıların kendiliğinden istediği diğer simge adresleri 404 döner.
[[redirects]]
  from = "/favicon.ico"
  to = "/404.txt"
  status = 404

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/404.txt"
  status = 404

[[redirects]]
  from = "/apple-touch-icon-precomposed.png"
  to = "/404.txt"
  status = 404

# Statik dosya klasörlerinde olmayan bir dosya (örn. yeni yayından sonra eski bir JS parçası) 404 döner;
# uygulama bunu yakalayıp "Sayfa yüklenemedi" ekranını gösterir.
[[redirects]]
  from = "/assets/*"
  to = "/404.txt"
  status = 404

[[redirects]]
  from = "/fonts/*"
  to = "/404.txt"
  status = 404

[[redirects]]
  from = "/images/*"
  to = "/404.txt"
  status = 404

[[redirects]]
  from = "/og/*"
  to = "/404.txt"
  status = 404

# Tek sayfa uygulaması: diskte karşılığı olmayan tüm adresler index.html'e düşer,
# yönlendirmeyi ve 404 sayfasını React Router üstlenir. robots.txt, /assets, /fonts gibi
# gerçek dosyalar bu kuraldan etkilenmez (Netlify varsayılanı: önce dosya).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Temel güvenlik başlıkları (tüm yanıtlar). Content-Security-Policy henüz eklenmedi.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# Düz metin dosyaları Türkçe karakter içerdiği için karakter kümesiyle sunulur.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/404.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# index.html her seferinde sunucuya sorulsun; yeni yayın hemen görünsün.
# SPA yönlendirmesiyle gelen diğer adresler için Netlify zaten "max-age=0, must-revalidate" kullanır.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# Vite'ın ürettiği dosya adları içerik özeti taşıdığı için uzun süre önbelleğe alınabilir.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font dosyalarının adında özet yok; dosya değişirse adı da değiştirilmeli.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# İllüstrasyon ve paylaşım görsellerinin adında özet yok; bir gün önbellekte kalır, sonra yeniden doğrulanır.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
