[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 için Node 20.19+ yeterli; React Router 8 ise Node 22.22+ istiyor.
  NODE_VERSION = "22"

# Tek sayfa uygulaması: bilinmeyen tüm adresler index.html'e düşer,
# yönlendirmeyi ve 404 sayfasını React Router üstlenir.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite'ın ürettiği dosya adları içerik özeti taşıdığı için uzun süre önbelleğe alınabilir.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Font dosyalarının adında özet yok; dosya değişirse adı da değiştirilmeli.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
